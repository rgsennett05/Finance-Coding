# Runs the fund once every weekday on GitHub's servers — your computer can be off.
#
# One-time setup: repo Settings → Secrets and variables → Actions → New repository secret
#   ALPACA_API_KEY      your Alpaca PAPER key (starts with PK)
#   ALPACA_SECRET_KEY   your Alpaca PAPER secret
#   ANTHROPIC_API_KEY   optional — not used while the Portfolio Manager is in rules mode
#
# Run history: every run's log is saved permanently on the `fund-history` branch (one JSON file
# per run). The run loads that history first, so the agents and the dashboard see every past day.
# On your computer, `python -m trading.history` downloads it into logs/.
#
# Alerts: the run ends in a red ✕ — and GitHub emails you — if an order is rejected, an order or
# stop-loss change fails, or any position is left without a stop-loss.
name: Daily fund run

on:
  schedule:
    # 15:07 UTC = 10:07am New York in winter, 11:07am in summer — market is open either way.
    - cron: "7 15 * * 1-5"
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write             # needed to save the run log to the fund-history branch

concurrency:
  group: daily-fund-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the checks
        run: pytest -q

      - name: Load run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" fund-history >/dev/null; then
            git clone --quiet --branch fund-history --single-branch --depth 1 "$url" history
          else
            mkdir history && git -C history init --quiet -b fund-history && git -C history remote add origin "$url"
          fi
          mkdir -p logs
          cp history/run_*.json logs/ 2>/dev/null || true
          echo "Loaded $(ls logs/run_*.json 2>/dev/null | wc -l) past runs"

      - name: Run the fund (paper trading)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m trading.run --yes

      - name: Save run history
        if: always()
        run: |
          cp logs/run_*.json history/ 2>/dev/null || { echo "No run log to save"; exit 0; }
          cd history
          git config user.name "trading-city[bot]"
          git config user.email "trading-city@users.noreply.github.com"
          git add run_*.json
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit --quiet -m "Run log $(date -u +%F)"
          git push --quiet origin fund-history
          echo "Saved $(ls run_*.json | wc -l) runs to the fund-history branch"
