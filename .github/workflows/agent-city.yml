# Runs the agent city on GitHub's servers — your computer can be off.
#
# Setup (once): repo Settings → Secrets and variables → Actions → New secret
#   SEC_USER_AGENT     e.g. "TickerCity you@example.com"   (needed for DCFs)
#   ANTHROPIC_API_KEY  optional — opens the Research Library
#
# Results are committed to city/state/ and attached to each run as an artifact.
name: Agent City

on:
  schedule:
    - cron: "17 22 * * 1-5"   # weekdays, ~6:17pm New York, after the close
  workflow_dispatch:           # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: agent-city
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run the city
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run city
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-map
          path: city/state/
      - name: Commit results
        if: always() && hashFiles('city/state/latest.json') != ''
        run: |
          git config user.name "agent-city[bot]"
          git config user.email "agent-city@users.noreply.github.com"
          git add -f city/state/latest.json city/state/city.html city/state/history/
          git diff --cached --quiet || git commit -m "City shift $(date -u +%F) [skip ci]"
          git push
