<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trading City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a full-bleed 3D scene; glass HUD cards float at the corners. The sky sets the mood, so the HUD
     follows the time of day (day = frosted white, night = smoked glass) instead of the viewer's theme. */
  :root {
    --hud-bg: rgba(255,255,255,0.78); --hud-line: rgba(18,30,44,0.12); --ink: #13202e; --ink-2: #4a5a6b; --ink-3: #7a8796;
    --accent: #2a78d6; --good: #138a5e; --bad: #c7362f; --warn: #a86a00; --chip: #eef3f9;
    --font-display: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --sig: #2a78d6; --prop: #6250d6; --ord: #1baf7a; --skip: #d99a00; --prev: #8b97a5; --blk: #e34948;
    color-scheme: light;
  }
  body.night {
    --hud-bg: rgba(14,20,32,0.72); --hud-line: rgba(255,255,255,0.12); --ink: #eef2f8; --ink-2: #b6c1cf; --ink-3: #8794a6;
    --accent: #5aa2f0; --good: #3fcf96; --bad: #ff7b74; --warn: #f2b84b; --chip: rgba(255,255,255,0.08);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.45 var(--font-body); color: var(--ink); background: #9fb8d4; }
  #scene { position: fixed; inset: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hud { position: fixed; background: var(--hud-bg); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
    border: 1px solid var(--hud-line); border-radius: 14px; box-shadow: 0 10px 30px rgba(10,20,35,0.14); transition: background .6s, color .6s; }
  #title { top: calc(12px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); padding: 10px 14px; width: 250px; }
  #title h1 { margin: 0 0 6px; font: 600 17px/1.2 var(--font-display); letter-spacing: .01em; }
  .kv { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--ink-2); }
  .kv b { color: var(--ink); font: 500 13px var(--font-data); }
  .meta { margin-top: 6px; font-size: 12px; color: var(--ink-3); }
  .busy { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .busy .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
  .busy .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .8s; }
  #controls { top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); padding: 8px; display: flex; flex-wrap: wrap;
    gap: 6px; justify-content: flex-end; max-width: min(560px, calc(100vw - 290px)); }
  button, select { font: 500 12.5px var(--font-body); border: 1px solid var(--hud-line); background: var(--chip); color: var(--ink); border-radius: 9px;
    padding: 6px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  #clock { display: flex; align-items: center; gap: 6px; font: 500 12px var(--font-data); color: var(--ink-2); }
  #clock input { width: 110px; accent-color: var(--accent); }
  #caption { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 9px 16px; font-size: 14px;
    max-width: min(620px, calc(100vw - 32px)); text-align: center; }
  #legend { left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 9px 12px; font-size: 12px; color: var(--ink-2); }
  #legend div { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  #legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #panel { top: calc(64px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 24px));
    max-height: calc(100% - 150px); overflow: auto; padding: 16px; }
  #panel h2 { margin: 0; font: 600 17px var(--font-display); }
  #panel .sub { color: var(--ink-3); font-size: 12px; margin: 2px 0 10px; }
  #panel .close { position: absolute; top: 10px; right: 10px; padding: 3px 9px; }
  #panel ul { padding-left: 18px; margin: 8px 0 0; }
  #panel li { margin: 6px 0; color: var(--ink-2); }
  #panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #panel td { padding: 5px 0; border-bottom: 1px solid var(--hud-line); }
  #panel td:last-child { text-align: right; font-family: var(--font-data); color: var(--ink); }
  .tag { display: inline-block; font: 500 11px var(--font-body); padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--ink-2); margin-left: 6px; vertical-align: 2px; }
  .tag.good { color: var(--good); } .tag.bad { color: var(--bad); } .tag.warn { color: var(--warn); }
  .label { font: 500 11.5px var(--font-body); padding: 3px 9px; border-radius: 8px; background: var(--hud-bg); border: 1px solid var(--hud-line); color: var(--ink);
    white-space: nowrap; pointer-events: none; text-align: center; backdrop-filter: blur(6px); }
  .label small { display: block; color: var(--ink-3); font-size: 10px; font-weight: 400; }
  .label.agent { border-color: var(--accent); font-family: var(--font-display); font-weight: 600; }
  .label.planned { opacity: .75; border-style: dashed; }
  .label.sign { font: 500 10px var(--font-data); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  #fallback { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: #dfe7f0; color: #3a4757; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 500 13px var(--font-data); color: #3a4757; letter-spacing: .1em; }
  @media (max-width: 720px) {
    #legend { display: none; }
    #title { width: auto; max-width: calc(100vw - 24px); }
    #controls { top: auto; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); left: 12px; right: 12px; max-width: none; justify-content: center; }
    #panel { top: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); max-height: 45%; }
  }
</style>
</head>
<body>
<div id="scene" aria-label="3D city: each agent of the fund is a building and each stock a tower. The caption and the building panel give the same information as text."></div>
<div id="loading">BUILDING THE CITY…</div>

<div id="title" class="hud">
  <h1>Trading City</h1>
  <div class="kv"><span>Portfolio</span><b id="pv">—</b></div>
  <div class="kv"><span>Cash</span><b id="cash">—</b></div>
  <div class="meta" id="meta"></div>
  <div class="busy" title="How busy the fund is right now"><span>Activity</span><span class="bar"><i id="busyBar"></i></span><span id="busyTxt"></span></div>
</div>

<div id="controls" class="hud">
  <button id="replay" class="primary">▶ Replay latest run</button>
  <span id="clock"><label for="timeMode" class="sr">Time of day</label>
    <select id="timeMode">
      <option value="live">New York time</option>
      <option value="cycle">Fast day/night</option>
      <option value="manual">Pick a time</option>
    </select>
    <input id="hour" type="range" min="0" max="24" step="0.05" aria-label="Hour of day">
    <span id="hourTxt">--:--</span>
  </span>
  <button id="trails" aria-pressed="true">Trade trails</button>
  <button id="sound" aria-pressed="false">Sound off</button>
  <button id="reset">Reset view</button>
</div>

<div id="panel" class="hud" role="dialog" aria-live="polite" hidden><button class="close" id="close" aria-label="Close">✕</button><div id="panelBody"></div></div>
<div id="caption" class="hud">Drag to rotate · scroll or pinch to zoom · tap a building</div>
<div id="legend" class="hud">
  <div><i style="background:var(--sig)"></i>Signals</div>
  <div><i style="background:var(--prop)"></i>Proposed trades</div>
  <div><i style="background:var(--ord)"></i>Order sent ✓</div>
  <div><i style="background:var(--skip)"></i>Order waiting / skipped</div>
  <div><i style="background:var(--prev)"></i>Preview only</div>
  <div><i style="background:var(--blk)"></i>Blocked by risk ✕</div>
</div>
<div id="fallback">The 3D city needs WebGL and an internet connection to load its 3D engine.</div>

<script>
  const CITY = /*__CITY_STATE__*/null;
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { Sky } from "three/addons/objects/Sky.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// =====================================================================================
// State + helpers
// =====================================================================================
const S = CITY || { agents: [], flows: [], stocks: [], trades: [], account: {}, run: {}, activity: { level: 0.2 } };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const money = (n) => (n == null ? "—" : "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 }));
const pct = (n, d = 1) => (n == null ? "—" : (n >= 0 ? "+" : "") + (n * 100).toFixed(d) + "%");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let seed = 20261102;
const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr = (a, b) => a + (b - a) * rand();
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const FLOW_COLORS = { signal: 0x2a78d6, proposal: 0x6250d6, order: 0x1baf7a, skipped: 0xd99a00, preview: 0x8b97a5, blocked: 0xe34948 };

$("pv").textContent = money(S.account.portfolio_value);
$("cash").textContent = money(S.account.cash);
$("meta").textContent = [
  S.market_open ? "● Market open" : "○ Market closed",
  S.run.at ? `last run ${S.run.at.slice(5, 16).replace("T", " ")} UTC (${S.run.mode === "paper" ? "paper trades" : "preview"})` : "no runs yet",
].join(" · ");

// =====================================================================================
// Renderer, scene, camera, controls
// =====================================================================================
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (e) { $("fallback").style.display = "flex"; $("loading").remove(); throw e; }
const host = $("scene");
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
host.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
Object.assign(labelRenderer.domElement.style, { position: "absolute", top: "0", pointerEvents: "none" });
host.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfd2e6, 0.0011);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 6000);
const HOME = { pos: new THREE.Vector3(120, 165, 270), target: new THREE.Vector3(0, 18, -30) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.12;
controls.minDistance = 60;
controls.maxDistance = 900;

const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environment = envMap;
const envMats = [];   // materials whose reflections dim at night

// Sky, sun, moon, stars
const sky = new Sky();
sky.scale.setScalar(5000);
sky.material.uniforms.turbidity.value = 6;
sky.material.uniforms.rayleigh.value = 1.6;
sky.material.uniforms.mieCoefficient.value = 0.004;
sky.material.uniforms.mieDirectionalG.value = 0.8;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x6b6253, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3df, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 50, far: 1400 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x8fa8d8, 0.0);
moon.position.set(300, 500, -200);
scene.add(moon);

const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i = 0; i < 1600; i++) {
  const th = rand() * Math.PI * 2, ph = Math.acos(rr(0.08, 1));
  starPos.push(Math.sin(ph) * Math.cos(th) * 3000, Math.cos(ph) * 3000, Math.sin(ph) * Math.sin(th) * 3000);
}
starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false }));
scene.add(stars);

// =====================================================================================
// Procedural textures: window facades (day) + lit windows (night)
// =====================================================================================
const CELL_W = 4, FLOOR_H = 3.6, CELLS = 16;   // one window = 4 m wide, one floor = 3.6 m
function canvas(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }
function facadeTextures(frame, glassA, glassB, litChance) {
  const px = 32, size = px * CELLS;
  const day = canvas(size, size, (g) => {
    g.fillStyle = frame; g.fillRect(0, 0, size, size);
    for (let y = 0; y < CELLS; y++) for (let x = 0; x < CELLS; x++) {
      const grd = g.createLinearGradient(0, y * px, 0, (y + 1) * px);
      grd.addColorStop(0, glassA); grd.addColorStop(1, glassB);
      g.fillStyle = grd;
      g.fillRect(x * px + 3, y * px + 4, px - 6, px - 9);
    }
  });
  const lit = canvas(size, size, (g) => {
    g.fillStyle = "#000"; g.fillRect(0, 0, size, size);
    for (let y = 0; y < CELLS; y++) for (let x = 0; x < CELLS; x++) {
      if (rand() > litChance) continue;
      const warm = rand();
      g.fillStyle = warm > 0.8 ? "#bcd6ff" : warm > 0.4 ? "#ffd9a0" : "#ffe9c7";
      g.globalAlpha = rr(0.55, 1);
      g.fillRect(x * px + 3, y * px + 4, px - 6, px - 9);
    }
    g.globalAlpha = 1;
  });
  const mk = (c) => { const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace; return t; };
  return { map: mk(day), lit: mk(lit) };
}
const FACADES = [
  facadeTextures("#c9ccd0", "#7f97ad", "#a9bccd", 0.42),   // concrete + blue glass
  facadeTextures("#b9b2a6", "#6f7f8c", "#9aa8b3", 0.38),   // warm stone
  facadeTextures("#dfe3e8", "#8eb0cc", "#c4d6e4", 0.46),   // white + light glass
  facadeTextures("#3c4651", "#5d7790", "#90a9bf", 0.5),    // dark steel
];
const AGENT_FACADE = facadeTextures("#e9eef3", "#4d86c4", "#9cc3e8", 0.7);

function facadeMaterial(f, opts = {}) {
  const m = new THREE.MeshStandardMaterial({
    map: f.map, emissiveMap: f.lit, emissive: 0xffffff, emissiveIntensity: 0, roughness: opts.roughness ?? 0.35, metalness: opts.metalness ?? 0.35,
  });
  m.userData.nightGlow = opts.nightGlow ?? 1;
  envMats.push(m);
  return m;
}
const fillerMats = FACADES.map((f) => facadeMaterial(f));
const agentMat = facadeMaterial(AGENT_FACADE, { metalness: 0.55, roughness: 0.2, nightGlow: 1.4 });

// A box whose UVs repeat one window per 4 m and one floor per 3.6 m; roofs map to the frame color.
function texturedBox(w, h, d, x = 0, y = 0, z = 0) {
  const g = new THREE.BoxGeometry(w, h, d);
  const uv = g.attributes.uv;
  const ou = rand(), ov = rand();
  const faceSpan = [d, d, 0, 0, w, w];   // +x, -x, +y, -y, +z, -z
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) {
    const i = f * 4 + k;
    if (faceSpan[f] === 0) { uv.setXY(i, 0.001, 0.001); continue; }
    uv.setXY(i, ou + uv.getX(i) * faceSpan[f] / (CELL_W * CELLS), ov + uv.getY(i) * h / (FLOOR_H * CELLS));
  }
  g.translate(x, y + h / 2, z);
  return g;
}

// =====================================================================================
// Layout (metres). Main avenue runs east-west at z = 0.
// =====================================================================================
const AV = { z: 0, w: 22 };
const AGENT_Z = -46, PLANNED_Z = -112, MARKET_Z = 46;
const CORE = { x0: -120, x1: 120, z0: -140, z1: 82 };
const EW_ROADS = [-140, -205, 82, 147, 212];
const NS_ROADS = [-120, -185, -250, 120, 185, 250];
const ROAD_W = 13;

const asphalt = new THREE.MeshStandardMaterial({ color: 0x3a3e44, roughness: 0.92 });
const sidewalk = new THREE.MeshStandardMaterial({ color: 0xc9c6bf, roughness: 0.95 });
const grass = new THREE.MeshStandardMaterial({ color: 0x6f9a5e, roughness: 1 });
const plazaMat = new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.9 });
const markMat = new THREE.MeshBasicMaterial({ color: 0xf2efe6 });
const yellowMark = new THREE.MeshBasicMaterial({ color: 0xe8b84a });

const base = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), sidewalk);
base.rotation.x = -Math.PI / 2; base.receiveShadow = true; scene.add(base);
const far = new THREE.Mesh(new THREE.CircleGeometry(2600, 48), new THREE.MeshStandardMaterial({ color: 0x8e9a84, roughness: 1 }));
far.rotation.x = -Math.PI / 2; far.position.y = -0.2; scene.add(far);

function flat(w, d, x, z, mat, y = 0.02) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m;
}
function dashes(axis, fixed, from, to, mat, y = 0.05) {
  const geos = [];
  for (let p = from; p < to; p += 9) {
    const g = new THREE.PlaneGeometry(axis === "x" ? 4.5 : 0.35, axis === "x" ? 0.35 : 4.5);
    g.rotateX(-Math.PI / 2);
    g.translate(axis === "x" ? p : fixed, y, axis === "x" ? fixed : p);
    geos.push(g);
  }
  scene.add(new THREE.Mesh(mergeGeometries(geos), mat));
}
flat(1400, AV.w, 0, AV.z, asphalt);
flat(1400, 2.2, 0, AV.z, grass, 0.06);           // planted median
dashes("x", AV.z - 5.5, -700, 700, markMat); dashes("x", AV.z + 5.5, -700, 700, markMat);
for (const z of EW_ROADS) { flat(1400, ROAD_W, 0, z, asphalt); dashes("x", z, -700, 700, yellowMark); }
for (const x of NS_ROADS) { flat(ROAD_W, 1400, x, 0, asphalt, 0.03); dashes("z", x, -700, 700, yellowMark); }
for (const x of NS_ROADS) for (let k = -4; k <= 4; k++) { flat(1.1, 5, x + k * 1.6, AV.z - AV.w / 2 - 3, markMat, 0.06); flat(1.1, 5, x + k * 1.6, AV.z + AV.w / 2 + 3, markMat, 0.06); }
flat(ROAD_W, 70, -40, -38, asphalt, 0.03); flat(ROAD_W, 70, 40, -38, asphalt, 0.03);
flat(260, ROAD_W, 0, -84, asphalt, 0.03);

const parks = [[-104, -38, 22, 60], [104, -38, 22, 60], [0, MARKET_Z + 36, 220, 14], [0, PLANNED_Z - 22, 220, 12]];
for (const [x, z, w, d] of parks) flat(w, d, x, z, grass, 0.05);

// =====================================================================================
// Filler skyline: hundreds of towers merged into a few draw calls
// =====================================================================================
const buckets = FACADES.map(() => []);
const roofBits = [];
function inCore(x, z, pad = 0) { return x > CORE.x0 - pad && x < CORE.x1 + pad && z > CORE.z0 - pad && z < CORE.z1 + pad; }
const ns = [...NS_ROADS, 315, -315].sort((a, b) => a - b), ew = [-270, ...EW_ROADS, AV.z, 277].sort((a, b) => a - b);
const blockCentres = [];
for (let i = 0; i < ns.length - 1; i++) for (let j = 0; j < ew.length - 1; j++) {
  const cx = (ns[i] + ns[i + 1]) / 2, cz = (ew[j] + ew[j + 1]) / 2;
  const touchesAv = ew[j + 1] === AV.z || ew[j] === AV.z;
  const bw = ns[i + 1] - ns[i] - ROAD_W - 8, bd = ew[j + 1] - ew[j] - (touchesAv ? AV.w / 2 + ROAD_W / 2 : ROAD_W) - 8;

function route(aId, bId) {
  const A = buildings[aId].anchor, B = buildings[bId].anchor;
  const P = (x, z, y = 1.6) => new THREE.Vector3(x, y, z);
  const exitA = A.z < AV.z ? AV.z - AV.w / 2 + 3 : AV.z + AV.w / 2 - 3;
  const exitB = B.z < AV.z ? AV.z - AV.w / 2 + 3 : AV.z + AV.w / 2 - 3;
  return new THREE.CatmullRomCurve3([A.clone(), P(A.x, (A.z + exitA) / 2), P(A.x, exitA), P(B.x, exitB), P(B.x, (B.z + exitB) / 2), B.clone()], false, "catmullrom", 0.05);
}
const glowTex = new THREE.CanvasTexture(canvas(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.3, "rgba(255,255,255,.6)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); }));
const running = [];
function launch(step, done) {
  if (!buildings[step.from] || !buildings[step.to]) return done();
  const curve = route(step.from, step.to);
  const color = FLOW_COLORS[step.kind] ?? FLOW_COLORS.preview;
  const dots = [];
  for (let i = 0; i < 9; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: 1 - i * 0.09, depthWrite: false, blending: THREE.AdditiveBlending }));
    sp.scale.setScalar(9 - i * 0.6);
    scene.add(sp); dots.push(sp);
  }
  running.push({ curve, dots, t: 0, dur: reduceMotion ? 0.01 : 2.6, stopAt: step.kind === "blocked" ? 0.55 : 1, done });
}

const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 120) : ms));
function caption(t) { $("caption").textContent = t; }
function glowBuilding(id, lvl, kind) {
  const b = buildings[id]; if (!b) return;
  b.glowTarget = lvl;
  if (kind) { b.flash = new THREE.Color(FLOW_COLORS[kind] ?? FLOW_COLORS.preview); b.pulse = 1; }
}
async function replay() {
  if (playing) return;
  playing = true; $("replay").disabled = true; closePanel();
  replayBoost = 1;
  if (!S.flows.length) caption("No run logged yet. Run the fund to see the city at work.");
  glowBuilding("market_analyst", 1, "signal");
  caption("📈 Market Analyst reads the tape and scores every stock…");
  chime(0);
  await wait(1400);
  for (const step of S.flows) {
    const icon = { signal: "📈", proposal: "🧠", order: "✅", skipped: "⏸", preview: "👁", blocked: "⛔" }[step.kind] || "•";
    caption(`${icon} ${step.label}`);
    glowBuilding(step.from, 1);
    await new Promise((res) => launch(step, res));
    glowBuilding(step.kind === "blocked" ? step.from : step.to, 1, step.kind);
    chime(step.kind === "order" ? 2 : step.kind === "blocked" ? 3 : 1);
    await wait(500);
  }
  caption(S.flows.length ? "Run complete. Tap any building for its reasoning." : "Tap any building to explore.");
  setTimeout(() => { Object.values(buildings).forEach((b) => (b.glowTarget = 0.2)); }, 3000);
  playing = false; $("replay").disabled = false;
}

// =====================================================================================
// Sound (off by default; starts only after a click)
// =====================================================================================
let audio = null, soundOn = false;
function chime(kind) {
  if (!soundOn) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const notes = [[523.25, 659.25], [659.25, 783.99], [783.99, 1046.5], [220, 196]][kind] || [523.25];
  notes.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = kind === 3 ? "triangle" : "sine"; o.frequency.value = f;
    const t0 = audio.currentTime + i * 0.12;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.08, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + 1);
  });
}
$("sound").onclick = () => { soundOn = !soundOn; $("sound").setAttribute("aria-pressed", String(soundOn)); $("sound").textContent = soundOn ? "Sound on" : "Sound off"; if (soundOn) chime(1); };
$("trails").onclick = () => { trailGroup.visible = !trailGroup.visible; $("trails").setAttribute("aria-pressed", String(trailGroup.visible)); };

// =====================================================================================
// Time of day (New York) -> sun, sky, lights
// =====================================================================================
function nyHour() {
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date()).map((x) => [x.type, x.value]));
  return (Number(p.hour) % 24) + Number(p.minute) / 60;
}
let mode = store.get("city.timeMode") || "live", manualHour = 12, cycleStart = performance.now();
$("timeMode").value = mode;
$("timeMode").onchange = (e) => { mode = e.target.value; store.set("city.timeMode", mode); cycleStart = performance.now(); if (mode === "manual") manualHour = Number($("hour").value); };
$("hour").oninput = (e) => { mode = "manual"; $("timeMode").value = "manual"; manualHour = Number(e.target.value); };
function currentHour() {
  if (mode === "manual") return manualHour;
  if (mode === "cycle") return (6 + ((performance.now() - cycleStart) / 1000) * (24 / 80)) % 24;   // a full day in 80 s
  return nyHour();
}
const sunDir = new THREE.Vector3();
let night = 0;
let matCache = null;
function allMats() {   // every lit material in the scene (reflections dim at night)
  if (!matCache) {
    const set = new Set();
    scene.traverse((o) => { if (o.material && o.material.isMeshStandardMaterial) set.add(o.material); });
    matCache = [...set];
  }
  return matCache;
}
function applyTime(h) {
  // Early November in New York: sunrise ~6:30, sunset ~16:50, noon sun ~38° high.
  const dayFrac = (h - 6.5) / 10.4;
  const elev = Math.sin(Math.PI * dayFrac) * 38;
  const az = THREE.MathUtils.lerp(112, 248, Math.min(1, Math.max(0, dayFrac)));
  sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - elev), THREE.MathUtils.degToRad(az));
  sky.material.uniforms.sunPosition.value.copy(sunDir);
  night = 1 - smooth(-7, 4, elev);
  const golden = smooth(0, 12, elev) * (1 - smooth(12, 26, elev));
  sun.position.copy(sunDir).multiplyScalar(700);
  sun.intensity = 2.6 * smooth(-2, 8, elev);
  sun.color.setHSL(0.08, 0.7 * golden + 0.12, 0.78 + 0.18 * (1 - golden));
  moon.intensity = 0.32 * night;
  hemi.intensity = THREE.MathUtils.lerp(0.95, 0.2, night);
  hemi.color.setHSL(0.62, 0.5, THREE.MathUtils.lerp(0.82, 0.36, night));
  hemi.groundColor.setHSL(0.08, 0.15, THREE.MathUtils.lerp(0.38, 0.06, night));
  renderer.toneMappingExposure = THREE.MathUtils.lerp(0.62, 0.74, night) + 0.12 * golden;
  scene.fog.color.setHSL(THREE.MathUtils.lerp(0.58, 0.63, night), THREE.MathUtils.lerp(0.35, 0.45, night), Math.max(0.04, THREE.MathUtils.lerp(0.78, 0.07, night) - 0.1 * golden));
  scene.fog.density = THREE.MathUtils.lerp(0.0009, 0.0012, night);
  stars.material.opacity = smooth(0.55, 1, night);
  for (const m of allMats()) m.envMapIntensity = THREE.MathUtils.lerp(1, 0.08, night);
  for (const m of envMats) m.emissiveIntensity = night * 1.3 * m.userData.nightGlow;
  headMat.emissiveIntensity = night * 2.2;
  poolMat.opacity = night * 0.75;
  headLightMat.color.setHex(night > 0.4 ? 0xfff2cc : 0x7c776c);
  tailLightMat.color.setHex(night > 0.4 ? 0xff3b30 : 0x5a1f1f);
  document.body.classList.toggle("night", night > 0.55);
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  $("hourTxt").textContent = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")} NY`;
  if (mode !== "manual") $("hour").value = h;
}

// =====================================================================================
// Picking + panel + camera moves
// =====================================================================================
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hovered = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.id : null;
}
renderer.domElement.addEventListener("pointermove", (ev) => {
  const id = pick(ev);
  if (id === hovered) return;
  if (hovered && buildings[hovered]) buildings[hovered].hover = false;
  hovered = id; if (id) buildings[id].hover = true;
  renderer.domElement.style.cursor = id ? "pointer" : "grab";
});
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (ev) => (downAt = [ev.clientX, ev.clientY]));
renderer.domElement.addEventListener("pointerup", (ev) => {
  if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 6) return;
  const id = pick(ev); if (id) openPanel(id);
});
function openPanel(id) {
  const b = buildings[id];
  let html;
  if (b.kind === "agent") {
    const a = b.data;
    const tag = a.status === "planned" ? `<span class="tag warn">under construction</span>` : `<span class="tag good">open for business</span>`;
    html = `<h2>${esc(a.name)}${tag}</h2><div class="sub">${esc(a.building)} · ${esc(a.role)}</div>
      <b>Latest run</b><ul>${a.details.map((d) => `<li>${esc(d)}</li>`).join("") || "<li>No run yet.</li>"}</ul>`;
  } else {
    const s = b.data;
    const sig = s.label ? `<span class="tag ${s.label === "bullish" ? "good" : s.label === "bearish" ? "bad" : ""}">${esc(s.label)}</span>` : "";
    const status = s.benchmark ? "Benchmark, never traded" : s.pending ? "Buy order waiting to fill" : s.shares ? "Owned" : "Not owned";
    const orders = (S.trades || []).filter((t) => t.ticker === s.ticker).slice(0, 4);
    const rows = [
      ["Status", status], ["Signal score", s.score == null ? "—" : (s.score >= 0 ? "+" : "") + s.score.toFixed(2)], ["Price", money(s.price)],
      ["Shares", s.shares || "—"], ["Value", s.value ? money(s.value) : "—"], ["Gain / loss", s.value ? pct(s.pl_pct, 2) : "—"],
      ["Share of portfolio", s.weight ? (s.weight * 100).toFixed(1) + "%" : "—"], ["Stop-loss", money(s.stop)],
    ];
    html = `<h2>${esc(s.ticker)}${sig}</h2><div class="sub">Market District${s.benchmark ? " · the monument we measure against" : ""}</div>
      <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
      ${orders.length ? `<b style="display:block;margin-top:10px">Orders</b><ul>${orders.map((t) => `<li>${esc(t.side.toUpperCase())} ${t.shares} · ${esc(t.status)}${t.submitted ? " · " + esc(t.submitted.slice(0, 10)) : ""}</li>`).join("")}</ul>` : ""}`;
  }
  $("panelBody").innerHTML = html; $("panel").hidden = false;
  focusOn(b);
}
function closePanel() { $("panel").hidden = true; }
$("close").onclick = closePanel;
let camAnim = null;
function moveCamera(pos, target) { camAnim = { from: camera.position.clone(), fromT: controls.target.clone(), to: pos, toT: target, t: 0 }; }
function focusOn(b) {
  const t = b.anchor.clone().setY(b.anchor.y + 12);
  const dir = camera.position.clone().sub(controls.target).normalize();
  moveCamera(t.clone().add(dir.multiplyScalar(b.kind === "agent" ? 210 : 150)), t);
}
let homePos = HOME.pos.clone();
$("reset").onclick = () => { closePanel(); moveCamera(homePos.clone(), HOME.target.clone()); };
$("replay").onclick = replay;

// =====================================================================================
// Resize + main loop
// =====================================================================================
function resize() {
  const w = host.clientWidth || innerWidth, h = host.clientHeight || innerHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  homePos = HOME.target.clone().add(HOME.pos.clone().sub(HOME.target).multiplyScalar(w / h < 0.9 ? 1.7 : 1));   // phones: step back
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
camera.position.copy(homePos);

const baseActivity = Math.min(1, Math.max(0.1, S.activity?.level ?? 0.2));
$("busyBar").style.width = Math.round(baseActivity * 100) + "%";
$("busyTxt").textContent = baseActivity > 0.6 ? "busy" : baseActivity > 0.35 ? "steady" : "quiet";
const clock = new THREE.Clock();
let lastHour = -1;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const h = currentHour();
  if (Math.abs(h - lastHour) > 0.004) { applyTime(h); lastHour = h; }
  if (!playing) replayBoost = Math.max(0, replayBoost - dt * 0.08);
  const busy = Math.min(1, baseActivity + 0.45 * replayBoost);
  const motion = reduceMotion ? 0 : 1;

  const nCars = Math.round(MAX_CARS * (0.18 + 0.82 * busy) * (1 - 0.55 * night));
  cars.count = headLights.count = tailLights.count = nCars;
  for (let i = 0; i < nCars; i++) {
    const c = carState[i], L = c.lane;
    c.p += c.v * L.dir * dt * motion * (0.7 + 0.6 * busy);
    if (c.p > L.len) c.p = -L.len; else if (c.p < -L.len) c.p = L.len;
    if (L.axis === "x") { tmp.position.set(c.p, 0.1, L.fixed); tmp.rotation.set(0, L.dir > 0 ? 0 : Math.PI, 0); }
    else { tmp.position.set(L.fixed, 0.1, c.p); tmp.rotation.set(0, L.dir > 0 ? -Math.PI / 2 : Math.PI / 2, 0); }
    tmp.scale.setScalar(1); tmp.updateMatrix();
    cars.setMatrixAt(i, tmp.matrix); headLights.setMatrixAt(i, tmp.matrix); tailLights.setMatrixAt(i, tmp.matrix);
  }
  cars.instanceMatrix.needsUpdate = headLights.instanceMatrix.needsUpdate = tailLights.instanceMatrix.needsUpdate = true;

  const nPeople = Math.round(MAX_PEOPLE * (0.15 + 0.85 * busy) * (1 - 0.7 * night));
  people.count = nPeople;
  for (let i = 0; i < nPeople; i++) {
    const p = pplState[i], P = p.path;
    p.p += p.v * dt * motion;
    if (p.p > P.b) { p.p = P.b; p.v *= -1; } else if (p.p < P.a) { p.p = P.a; p.v *= -1; }
    const bob = Math.abs(Math.sin(t * 6 + p.phase)) * 0.06;
    tmp.position.set(P.axis === "x" ? p.p : P.fixed + p.side, bob, P.axis === "x" ? P.fixed + p.side : p.p);
    tmp.rotation.set(0, p.v > 0 ? 0 : Math.PI, 0); tmp.scale.setScalar(1); tmp.updateMatrix();
    people.setMatrixAt(i, tmp.matrix);
  }
  people.instanceMatrix.needsUpdate = true;

  for (const b of Object.values(buildings)) {
    b.glow += (b.glowTarget - b.glow) * (1 - Math.exp(-dt * 3));
    b.pulse = Math.max(0, b.pulse - dt * 0.8);
    const lvl = b.glow + (b.hover ? 0.4 : 0) + 0.25 * busy + 0.4 * night;
    for (const m of b.accents) {
      m.emissiveIntensity = 0.25 + lvl * 1.6 + b.pulse * 2.5;
      m.emissive.copy(b.pulse > 0.02 && b.flash ? b.flash : m.userData.base);
    }
    const g = b.group.userData;
    if (g.spin) g.spin.rotation.z += dt * (0.25 + b.glow * 1.5) * motion;
    if (g.beacon) g.beacon.material.emissiveIntensity = (Math.sin(t * 3) > 0.6 ? 3 : 0.4) * (0.4 + night);
    if (g.jib) g.jib.rotation.y = Math.sin(t * 0.15 + b.anchor.x) * 0.9 * motion;
    if (g.scaffold) g.scaffold.material.opacity = 0.55 + 0.35 * Math.sin(t * 2.5);
    b.label.style.opacity = b.hover ? "1" : "0.94";
  }
  agentMat.emissiveIntensity = (night * 1.3 + 0.35 * busy) * agentMat.userData.nightGlow;

  for (let i = running.length - 1; i >= 0; i--) {
    const r = running[i];
    r.t = Math.min(r.stopAt, r.t + dt / r.dur);
    r.dots.forEach((d, k) => d.position.copy(r.curve.getPointAt(Math.max(0, Math.min(1, r.t - k * 0.018)))));
    if (r.t >= r.stopAt) { r.dots.forEach((d) => scene.remove(d)); running.splice(i, 1); r.done(); }
  }

  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / 1.2);
    const e = 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, e);
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
applyTime(currentHour());
tick();
$("loading").remove();

// Live mode: replay automatically when there's a run this viewer hasn't seen yet.
const seenKey = "city.lastSeenRun";
if (S.run.at && store.get(seenKey) !== S.run.at) {
  store.set(seenKey, S.run.at);
  setTimeout(replay, reduceMotion ? 0 : 1200);
} else {
  caption("Drag to rotate · scroll or pinch to zoom · tap a building · ▶ replays the latest run");
}
window.__city = { setHour: (h) => { mode = "manual"; manualHour = h; $("timeMode").value = "manual"; }, replay };
window.__cityReady = true;
</script>
</body>
</html>
