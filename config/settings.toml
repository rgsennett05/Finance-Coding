# Trading City settings. Edit these, not the code.

[watchlist]
# 5–10 tickers for Stage 1.
tickers = ["AAPL", "MSFT", "NVDA", "JPM", "KO", "XOM", "VOO"]
benchmark = "VOO"

[risk]
# Enforced by plain code in the Risk Manager — the AI cannot override these.
max_position_pct = 0.10   # no single position over 10% of the portfolio
min_cash_pct = 0.10       # keep at least 10% in cash
max_open_positions = 10
stop_loss_pct = 0.08      # every position gets a stop-loss 8% below entry
trim_buffer_pct = 0.01    # trim a position once it passes 11% (10% limit + 1% buffer), back down to 10%
cooldown_days = 7         # after a stop-loss sells a stock, don't buy it again for 7 calendar days

[portfolio_manager]
# "rules" = free, rule-based decisions. "ai" = Claude Opus decides (not built yet; needs ANTHROPIC_API_KEY).
mode = "rules"
# Rules mode blends the two analysts into one score from -1 to +1:
#   blended = market_weight × Market Analyst score + fundamentals_weight × Fundamentals Analyst score
# (a stock with no fundamentals uses the market score alone).
market_weight = 0.6
fundamentals_weight = 0.4
buy_above = 0.33          # buy a stock we don't own when its blended score is above this
sell_below = -0.33        # sell a stock we own when its blended score falls below this

[models]
# Routine agents use a cheaper model; the Portfolio Manager makes final calls.
routine = "claude-haiku-5-5"
portfolio_manager = "claude-opus-5-5"
